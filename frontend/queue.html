<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickServe - Queue</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <!-- <link rel="stylesheet" href="css/theme.css" /> -->
    <link rel="stylesheet" href="css/responsive.css" />
    <style>
      body {
        overflow: hidden;
      }
      .queue-page {
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="queue-page">
    <div class="queue-header glass">
      <img src="assets/images/logoquickserve.png" alt="QuickServe Logo" />
      QuickServe Order Queue
    </div>
    <div class="queue-container" id="queueContainer">
      <div class="queue-column">
        <div class="queue-col-header queue-col-pending">
          <i class="fas fa-clock"></i> Pending
        </div>
        <div id="pendingCol"></div>
      </div>
      <div class="queue-column">
        <div class="queue-col-header queue-col-preparing">
          <i class="fas fa-fire"></i> Preparing
        </div>
        <div id="preparingCol"></div>
      </div>
      <div class="queue-column">
        <div class="queue-col-header queue-col-ready">
          <i class="fas fa-check-circle"></i> Ready for Pickup
        </div>
        <div id="readyCol"></div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/queue.js"></script>
  </body>
</html>
