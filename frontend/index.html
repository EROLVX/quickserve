<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>QuickServe - Order</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>

    <header class="app-header glass">
      <div class="logo"><i class="fas fa-bolt"></i> QuickServe</div>
      <div class="header-actions">
        <div class="search-wrap">
          <input
            type="text"
            id="searchInput"
            class="form-input"
            placeholder="Search food..."
            style="width: 280px"
          />
        </div>
        <button class="btn btn-ghost" id="themeToggle" title="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <a href="user.html" class="btn btn-ghost" title="My Account">
          <i class="fas fa-user"></i>
        </a>
        <button class="btn btn-primary" id="cartToggle">
          <i class="fas fa-shopping-basket"></i>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <div class="category-bar" id="categoryBar"></div>

    <main class="main-content">
      <div class="products-grid" id="productsGrid">
        <div class="empty-state">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Loading menu...</p>
        </div>
      </div>
    </main>

    <aside class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h2><i class="fas fa-shopping-basket"></i> Your Order</h2>
        <button class="btn-icon" id="cartClose">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="cart-body" id="cartItems"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Total</span>
          <strong id="cartTotal">₱0.00</strong>
        </div>
        <a
          href="checkout.html"
          class="btn btn-primary btn-lg"
          id="checkoutLink"
          style="width: 100%"
        >
          Proceed to Checkout <i class="fas fa-arrow-right"></i>
        </a>
      </div>
    </aside>
    <div class="cart-overlay" id="cartOverlay"></div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
      document
        .getElementById("checkoutLink")
        .addEventListener("click", function (e) {
          if (getCartCount() === 0) {
            e.preventDefault();
            showToast(
              "Please add items to your cart first!",
              "fa-exclamation-circle",
            );
          }
        });
    </script>
  </body>
</html>
